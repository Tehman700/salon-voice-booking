# Local development stack.
#   docker compose up -d db          -> just Postgres (run the API with uv for hot reload)
#   docker compose up --build        -> Postgres + migrations + API container
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "127.0.0.1:5544:5432"  # uncommon port: 5432/5433 are often taken by other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://salon:salon@db:5432/salon
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://salon:salon@db:5432/salon
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
